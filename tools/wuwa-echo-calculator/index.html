<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>鸣潮声骸评分器已迁移</title>
<link rel="canonical" href="https://wuwatool.etg227.com/">
<style>
:root{--bg:#f7f9fe;--panel:#fff;--line:#e3e8ef;--text:#363636;--muted:#858585;--accent:#425aef}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#171a21;--line:rgba(255,255,255,.1);--text:#e7e9ee;--muted:#9aa1ad;--accent:#8b9bff}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}
main{width:min(520px,calc(100% - 32px));padding:28px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
h1{font-size:20px;margin:0 0 8px}p{margin:8px 0;font-size:14px}.muted{color:var(--muted);font-size:13px}
a.btn,button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;margin:6px 8px 0 0;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.primary{color:#0c0f16}}
</style>
</head>
<body>
<main>
<h1>鸣潮声骸评分器已迁移</h1>
<p>评分器现在独立运行在 <b>wuwatool.etg227.com</b>，功能更全（我的角色、声骸库、角色排名、抽卡记录、截图导入）。</p>
<div id="backup" hidden>
<p>检测到你在博客里保存过 <b id="count">0</b> 个角色配置。它们只存在本站的浏览器存储里，不会自动带到新网址，请先下载备份，再到新页面「数据 → 导入备份」。</p>
<button type="button" id="dl" class="primary">下载备份文件</button>
</div>
<p><a class="btn primary" id="go" href="https://wuwatool.etg227.com/">前往新版评分器</a><a class="btn" href="https://blog.etg227.com/">回到博客</a></p>
<p class="muted" id="note">稍后会自动跳转。</p>
</main>
<script>
(function(){
  var NEW='https://wuwatool.etg227.com/',KEY='wuwaEchoBuildProfilesV6',OLD=['wuwaEchoBuildProfilesV5','wuwaEchoBuildProfilesV4','wuwaEchoBuildProfilesV3','wuwaEchoBuildProfilesV2'];
  var profiles={};
  function read(k){try{var d=JSON.parse(localStorage.getItem(k)||'{}');return d&&typeof d==='object'?d:{}}catch(e){return{}}}
  var all=[KEY].concat(OLD);for(var i=0;i<all.length&&!Object.keys(profiles).length;i++)profiles=read(all[i]);
  var n=Object.keys(profiles).length;
  if(!n){setTimeout(function(){location.replace(NEW)},1500);return}
  document.getElementById('count').textContent=n;document.getElementById('backup').hidden=false;
  document.getElementById('note').textContent='下载备份之前不会自动跳转。';
  document.getElementById('dl').onclick=function(){
    var data={app:'wuwatool',kind:'backup',version:1,exportedAt:new Date().toISOString(),profiles:profiles,gacha:{}};
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));
    a.download='wuwatool-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();
    setTimeout(function(){a.remove()},500);document.getElementById('note').textContent='已下载。到新页面的「数据 → 导入备份」选择该文件即可。';
  };
})();
</script>
</body>
</html>

name: Generate feeds and sitemap

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'atom.xml'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'preview/**'

permissions:
  contents: write

concurrency:
  group: generate-feeds
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate atom.xml, sitemap.xml and robots.txt
        run: python3 scripts/generate-feeds.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atom.xml sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Feeds and sitemap are already up to date."
            exit 0
          fi
          git commit -m "chore: regenerate feeds and sitemap"
          git push origin HEAD:main

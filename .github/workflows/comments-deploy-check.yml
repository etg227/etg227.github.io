name: Comments deploy check (temporary)

on:
  push:
    branches:
      - claude/pensive-lamport-o3zb71
    paths:
      - '.github/workflows/comments-deploy-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the live comment service
        run: |
          B=https://comments.etg227.com
          O=https://blog.etg227.com
          P="/__deploy-check-${{ github.run_id }}/"
          echo "## root";            curl -sS -w '\nHTTP %{http_code}\n' "$B/"
          echo "## admin page";      curl -sS -o /dev/null -D - "$B/admin" | grep -iE '^HTTP|^content-type|^content-security-policy'
          echo "## list (empty)";    curl -sS -w '\nHTTP %{http_code}\n' "$B/api/comments?path=$P"
          echo "## CORS preflight";  curl -sS -o /dev/null -D - -X OPTIONS -H "Origin: $O" -H 'Access-Control-Request-Method: POST' "$B/api/comments" | grep -iE '^HTTP|access-control-allow-origin'
          echo "## other origin";    curl -sS -o /dev/null -D - -H 'Origin: https://evil.example' "$B/api/comments?path=$P" | grep -ciE 'access-control-allow-origin' || true
          echo "## invalid post";    curl -sS -w '\nHTTP %{http_code}\n' -X POST -H 'Content-Type: application/json' -H "Origin: $O" -d "{\"path\":\"$P\",\"nick\":\"\",\"content\":\"x\"}" "$B/api/comments"
          echo "## valid post";      curl -sS -w '\nHTTP %{http_code}\n' -X POST -H 'Content-Type: application/json' -H "Origin: $O" -d "{\"path\":\"$P\",\"nick\":\"部署检查\",\"content\":\"deploy check ${{ github.run_id }}\"}" "$B/api/comments"
          echo "## list (after)";    curl -sS -w '\nHTTP %{http_code}\n' "$B/api/comments?path=$P"
          echo "## admin, no token"; curl -sS -w '\nHTTP %{http_code}\n' "$B/api/admin/comments"
          echo "## latency (s)";     for i in 1 2 3 4 5; do curl -sS -o /dev/null -w '%{time_total}\n' "$B/api/comments?path=/"; done

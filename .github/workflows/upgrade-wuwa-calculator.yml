name: Validate WuWa calculator

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/wuwa-echo-calculator/**'
      - 'wuwa/profile-save-v3.js'
      - 'wuwa/data/character-mechanics*.json'
      - 'wuwa/data/sonata-effects.json'
      - '.github/workflows/upgrade-wuwa-calculator.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax check
        run: |
          node --check tools/wuwa-echo-calculator/app.js
          node --check tools/wuwa-echo-calculator/baseline-sync.js
          node --check tools/wuwa-echo-calculator/kuro-sync.js
          node --check wuwa/profile-save-v3.js
      - name: Data syntax check
        run: |
          python -m json.tool wuwa/data/character-mechanics.json >/dev/null
          python -m json.tool wuwa/data/character-mechanics-extra.json >/dev/null
          python -m json.tool wuwa/data/sonata-effects.json >/dev/null
